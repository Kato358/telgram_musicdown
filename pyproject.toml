[project]
name = "telgram-musicdown"
version = "0.1.0"
description = "Telegram 音乐下载器 — 单进程 FastAPI + Pyrogram 应用"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "pyrogram>=2.0",
    "mutagen>=1.47",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",       # pycodestyle
  "F",            # pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "ASYNC",        # async 陷阱
  "S",            # bandit
  "SIM",          # 简化
  "PTH",          # pathlib
  "RET",          # return 简化
  "T20",          # 禁止 print
  "PL",           # pylint 子集
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"run.py" = ["T201", "S603", "UP036"]

[tool.mypy]
# 全量覆盖 app/（不只 services/db/utils）：web/telegram 层曾因不在 files 里而漏检，
# 导致 IStore 协议漂移（delete_history/set_history_media）长期无声通过。
python_version = "3.11"
strict = true
files = ["app"]
[[tool.mypy.overrides]]
module = ["app.web.routes.*", "app.web.*"]
disallow_untyped_defs = false
[[tool.mypy.overrides]]
module = ["app.services.tags"]
disallow_untyped_calls = false
[[tool.mypy.overrides]]
module = ["pyrogram.*", "mutagen.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
