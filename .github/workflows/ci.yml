name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # 同一份代码只真正构建一次。
  #
  # push 到 main 与 push v* 标签是**两个独立的 push 事件**（GitHub 按 ref 触发，不会因为
  # 两者指向同一个 commit 就合并成一次运行），所以发版时必然有两个 run。省时间的办法不是
  # 合并事件，而是让 tag 那次不再重复构建：main 的 run 把镜像推成 `:sha-<完整 sha>`，
  # tag 的 run 探到这份镜像在，就只做 retag（几秒），test / build 全跳过——
  # 镜像在 ⇒ 该 commit 已经在 main 上过了 test + build + smoke，这个复用是安全的。
  #
  # 标签打在没推过 main 的提交上（`:sha-<sha>` 不存在）时 reuse=false，tag 那次走与 main
  # 完全相同的完整流水线，行为与改动前一致，不会因为「先打标签后推 main」而发布未测代码。
  plan:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.probe.outputs.reuse }}
    steps:
      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # 只有 tag 事件才需要碰 registry；main / PR 由下面的探测步骤直接给出 reuse=false
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe the per-commit image
        id: probe
        run: |
          reuse=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]] \
             && docker buildx imagetools inspect \
                  "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            reuse=true
            echo "::notice::复用 main 上构建的 ${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}：本次跳过 test / build，只 retag"
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest collect-only
        run: pytest --collect-only -q 2>&1 | tail -20

      - name: Pytest
        run: pytest -ra --tb=long

  build:
    runs-on: ubuntu-latest
    needs: [plan, test]
    if: needs.plan.outputs.reuse != 'true'
    steps:
      - uses: actions/checkout@v4
      # GHA 表达式无 lower()，job 内用 bash 把 owner/repo 降小写写入 GITHUB_ENV
      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # 只为 layer 缓存登录（PR 中无 packages:write 也能拉公共缓存）
      - name: Login to GHCR
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          # web_login_enabled=false：smoke 容器无凭据，0.0.0.0 无密码会被启动保护拒绝（WebAuthConfigError）
          docker run --rm -d --name tgm-smoke -p 8787:8787 \
            -e TGM_WEB_LOGIN_ENABLED=false \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then
              echo "image serves HTTP on 8787"; docker rm -f tgm-smoke; exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become ready in 30s"
          docker logs tgm-smoke; docker rm -f tgm-smoke; exit 1

  publish:
    # push 到 main 发滚动标签（:main / :latest / 每提交的 :sha-<sha>）。
    # push v* 标签：有现成的 :sha-<sha> 就 retag（同一份 manifest，不重建），否则完整
    # build + push。retag 出来的是同一份镜像，config 里的 label 仍是 main 那次构建写的
    # （imagetools 只能改 tag，改不了 config），需要 label 精确到版本号时看 Release 正文。
    needs: [plan, test, build]
    # test/build 被跳过（tag 复用了 main 的镜像）也要跑，所以不能只靠 needs 默认的「依赖成功」；
    # 有任何一个失败（failure()）就整体不发——哪怕 build 因此被跳过。
    if: >-
      !cancelled() && !failure()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GITHUB_ENV 按 job 隔离，publish 任务需重算
      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false：关掉 metadata-action 对 semver 标签的「自动 latest」。不关的话打
          # v* 标签会顺手把 :latest 挪到这条 tag 上（哪怕下面那行 raw 的 enable 是 false），
          # 与「:latest 只跟着 main 移动」的约定不符；给老提交补标签时更会把 latest 拽回去。
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 事件且 plan 探到镜像已在：把 main 那份 manifest 直接挂上版本标签，不重建
      - name: Retag the image built for this commit
        if: needs.plan.outputs.reuse == 'true'
        run: |
          src="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          tags=()
          while IFS= read -r tag; do
            # metadata 里也含 :sha-<sha> 本身；源与目标同名时不必再挂一次，跳过
            if [[ -n "$tag" && "$tag" != "$src" ]]; then tags+=(-t "$tag"); fi
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "retag ${src} -> ${tags[*]}"
          docker buildx imagetools create "${tags[@]}" "$src"

      # main 的 push（或 tag 提交没在 main 上构建过）：照旧完整构建
      - name: Build and push
        if: needs.plan.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # 打 v* 标签即发 GitHub Release：正文优先取仓库里的 docs/releases/<标签>.md（v0.1.0 那种
    # 手写正文），没有这个文件就退回 GitHub 自动生成的 release notes。
    # 排在 publish 之后：镜像没推上去，就不该先有一条 Release。重跑同一条标签也安全——
    # 有正文文件就按文件改，没有就跳过（gh release edit 不支持 --generate-notes）。
    # startsWith(...) 单独用不够：tag 的 run 里 test/build 是**被跳过**的，而 skipped 会沿
    # needs 链往下传——publish 因为带了状态函数（!cancelled() && !failure()）才照常跑，
    # release 只有 startsWith 就被连着跳掉了（v0.1.4 实测：镜像推上去了，Release 没建）。
    # 状态函数就是文档里那句「让任务继续的表达式」，这里与 publish 保持同一写法。
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write # 顶层是 contents: read；建 Release 要写权限
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          title="$GITHUB_REF_NAME"
          body=()
          if [[ -f "$notes" ]]; then
            # 首行 `# 标题` 当 Release 标题，正文从第二行起：标题与正文同出一个文件，
            # 「v0.1.0 沉浸全屏播放」那种写法因此不必再上网页改。
            if [[ "$(head -n 1 "$notes")" == "# "* ]]; then
              title="$(head -n 1 "$notes" | cut -c 3-)"
              tail -n +2 "$notes" > "$RUNNER_TEMP/release-notes.md"
              body=(--notes-file "$RUNNER_TEMP/release-notes.md")
            else
              body=(--notes-file "$notes")
            fi
          else
            echo "::notice::没有 $notes，正文改用 GitHub 自动生成的 release notes"
            body=(--generate-notes)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ -f "$notes" ]]; then
              gh release edit "$GITHUB_REF_NAME" --title "$title" "${body[@]}"
            else
              echo "::notice::Release $GITHUB_REF_NAME 已存在且无正文文件，保留现状"
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" "${body[@]}"
          fi
