name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest collect-only
        run: pytest --collect-only -q 2>&1 | tail -20

      - name: Pytest
        run: pytest -ra --tb=long

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # GHA 表达式无 lower()，job 内用 bash 把 owner/repo 降小写写入 GITHUB_ENV
      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # 只为 layer 缓存登录（PR 中无 packages:write 也能拉公共缓存）
      - name: Login to GHCR
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          # web_login_enabled=false：smoke 容器无凭据，0.0.0.0 无密码会被启动保护拒绝（WebAuthConfigError）
          docker run --rm -d --name tgm-smoke -p 8787:8787 \
            -e TGM_WEB_LOGIN_ENABLED=false \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then
              echo "image serves HTTP on 8787"; docker rm -f tgm-smoke; exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become ready in 30s"
          docker logs tgm-smoke; docker rm -f tgm-smoke; exit 1

  publish:
    # push 到 main 发滚动标签；打 v* tag 发版本标签
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GITHUB_ENV 按 job 隔离，publish 任务需重算
      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
