<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Telegram 音乐库</title>
    <script>
      // 浅色是默认态；tgm-theme 为 dark 或系统深色时才加 .dark（设计规范 §3.2）。
      // 首帧前落定，避免闪白（FR-WEB-06）；与 src/lib/stores/theme.svelte.ts 同键。
      (function () {
        try {
          var mode = localStorage.getItem("tgm-theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* 隐私模式下 localStorage 不可用时保持浅色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
